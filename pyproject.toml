[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "urban-geography"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Reproducible European urban geography batch analytics"
requires-python = ">=3.11,<3.12"
dependencies = [
  "apache-sedona==1.8.0",
  "pyspark==3.5.6",
  "pyarrow==19.0.1",
  "pyproj==3.7.1",
  "shapely==2.1.1",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "requests==2.32.5",
]

[project.scripts]
urban-geo = "urban_geography.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2", "types-requests==2.32.4.20250913"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Java and Sedona JARs; no network"]

[tool.mypy]
python_version = "3.11"
files = ["src/urban_geography"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/urban_geography"]
